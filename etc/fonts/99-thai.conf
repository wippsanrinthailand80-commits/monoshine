<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  monoshine - Thai font rendering configuration
  Ensures proper Thai vowel positioning via Noto Sans Thai
-->
<fontconfig>
  <match target="font">
    <test compare="contains" name="lang">
      <string>th</string>
    </test>
    <edit mode="assign" name="family" binding="strong">
      <string>Noto Sans Thai</string>
    </edit>
  </match>
  <match target="pattern">
    <test compare="contains" name="lang">
      <string>th</string>
    </test>
    <edit mode="prepend" name="family">
      <string>Noto Sans Thai</string>
      <string>Noto Sans</string>
    </edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Thai</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif Thai</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Thai</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
