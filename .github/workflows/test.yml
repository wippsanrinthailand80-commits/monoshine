name: Test monoshine distro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static xz-utils

      - name: Build monoshine for testing
        env:
          DEBIAN_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Test rootfs
        env:
          DEBIAN_ARCH: ${{ matrix.arch }}
        run: |
          set +e
          ROOTFS=/tmp/monoshine-test
          rm -rf "$ROOTFS"
          mkdir -p "$ROOTFS"
          echo "=== Extracting tarball ==="
          tar -xJf out/monoshine-${{ matrix.arch }}.tar.xz -C "$ROOTFS" 2>&1
          TAR_EXIT=$?
          if [ $TAR_EXIT -ne 0 ]; then
            echo "FAIL: tar extraction failed with exit code $TAR_EXIT"
            exit 1
          fi
          echo "Extraction OK"
          
          echo ""
          echo "=== Listing rootfs ==="
          ls -la "$ROOTFS/"

      - name: Verify essential files
        run: |
          ROOTFS=/tmp/monoshine-test
          ERRORS=0
          for f in etc/hostname etc/locale.gen etc/environment etc/fonts/conf.d/99-thai.conf usr/local/bin/monoshine-info; do
            if [ -f "$ROOTFS/$f" ]; then
              echo "PASS: $f exists"
            else
              echo "FAIL: $f missing"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "ERRORS: $ERRORS files missing"
            ls -la "$ROOTFS/etc/" 2>/dev/null
            ls -la "$ROOTFS/usr/local/bin/" 2>/dev/null
            exit 1
          fi

      - name: Verify configuration
        run: |
          ROOTFS=/tmp/monoshine-test
          echo "=== Hostname ==="
          cat "$ROOTFS/etc/hostname"
          grep -q "monoshine" "$ROOTFS/etc/hostname" && echo "PASS" || { echo "FAIL"; exit 1; }
          
          echo "=== Locale ==="
          grep -q "th_TH.UTF-8" "$ROOTFS/etc/locale.gen" && echo "PASS: Thai locale in locale.gen" || { echo "FAIL"; exit 1; }
          grep -q "th_TH.UTF-8" "$ROOTFS/etc/environment" && echo "PASS: Thai locale in environment" || { echo "FAIL"; exit 1; }
          
          echo "=== Font config ==="
          grep -q "Noto Sans Thai" "$ROOTFS/etc/fonts/conf.d/99-thai.conf" && echo "PASS" || { echo "FAIL"; exit 1; }
          
          echo "=== Package list ==="
          for pkg in nmap rkhunter lynis gnupg fail2ban clamav locales fonts-noto-core ibus-libthai libthai0; do
            grep -q "^${pkg}$" packages.list && echo "PASS: $pkg" || { echo "FAIL: $pkg"; exit 1; }
          done

      - name: Test chroot execution
        env:
          DEBIAN_ARCH: ${{ matrix.arch }}
        run: |
          ROOTFS=/tmp/monoshine-test

          # Map Debian arch to QEMU arch (arm64 -> aarch64, armhf -> arm)
          QEMU_ARCH="${{ matrix.arch }}"
          if [ "$QEMU_ARCH" = "arm64" ]; then
            QEMU_ARCH="aarch64"
          elif [ "$QEMU_ARCH" = "armhf" ]; then
            QEMU_ARCH="arm"
          fi

          # Copy qemu for cross-arch chroot (best effort; binfmt_misc also works)
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            sudo cp /usr/bin/qemu-${QEMU_ARCH}-static "$ROOTFS/usr/bin/" 2>/dev/null || true
          fi
          # Mount filesystems for chroot
          sudo mount -t proc proc "$ROOTFS/proc" 2>/dev/null || true
          sudo mount -t sysfs sysfs "$ROOTFS/sys" 2>/dev/null || true
          sudo mount --bind /dev "$ROOTFS/dev" 2>/dev/null || true

          echo "=== Running monoshine-info in chroot ==="
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo chroot "$ROOTFS" /usr/local/bin/monoshine-info 2>&1
          else
            sudo chroot "$ROOTFS" /usr/bin/qemu-${QEMU_ARCH}-static /usr/local/bin/monoshine-info 2>&1 || \
            sudo chroot "$ROOTFS" /usr/local/bin/monoshine-info 2>&1 || true
          fi
          echo "Chroot exit code: $?"

          echo "=== Checking package count ==="
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            PKG_COUNT=$(sudo chroot "$ROOTFS" dpkg -l 2>/dev/null | grep -c '^ii' || echo 0)
          else
            PKG_COUNT=$(sudo chroot "$ROOTFS" /usr/bin/qemu-${QEMU_ARCH}-static /usr/bin/dpkg -l 2>/dev/null | grep -c '^ii' || echo 0)
          fi
          echo "Installed packages: $PKG_COUNT"

          # Cleanup mounts
          sudo umount "$ROOTFS/proc" 2>/dev/null || true
          sudo umount "$ROOTFS/sys" 2>/dev/null || true
          sudo umount "$ROOTFS/dev" 2>/dev/null || true

      - name: Cleanup
        run: |
          rm -rf /tmp/monoshine-test
          echo "=== All tests passed ==="

