name: Build MAD EL OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/library/archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed archiso edk2-ovmf squashfs-tools

      - name: Build ISO
        env:
          OUTPUT_DIR: out
          WORK_DIR: /tmp/madel-work
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify output
        run: |
          ls -lh out/
          file out/madel-*.iso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: madel-iso
          path: out/madel-*.iso
          if-no-files-found: error
