name: Release monoshine

on:
  push:
    tags:
      - 'v*'
      - 'release*'

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf, amd64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static xz-utils

      - name: Build monoshine (${{ matrix.arch }})
        env:
          DEBIAN_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify output
        run: |
          ls -lh out/
          file out/monoshine-${{ matrix.arch }}.tar.xz

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/monoshine-${{ matrix.arch }}.tar.xz
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
